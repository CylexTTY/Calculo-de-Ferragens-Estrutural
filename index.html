<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Estrutural | Colunas e Sapatas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --background: #f8fafc;
      --card-border: #e2e8f0;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--background);
    }
    .navbar-brand {
      font-weight: 600;
      letter-spacing: -0.5px;
    }
    .main-card {
      border: 1px solid var(--card-border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    .card-header {
      background: var(--primary);
      color: white;
      padding: 1.2rem 1.5rem;
    }
    .nav-pills .nav-link {
      font-weight: 500;
      color: #64748b;
      border-radius: 8px;
      transition: all 0.2s;
    }
    .nav-pills .nav-link.active {
      background: var(--primary) !important;
      color: white !important;
    }
    .form-label {
      font-weight: 500;
      color: #1e293b;
      margin-bottom: 0.2rem;
      font-size: 0.85rem;
    }
    .form-control, .form-select {
      border-radius: 6px;
      padding: 0.4rem 0.8rem;
      border: 1px solid var(--card-border);
      font-size: 0.9rem;
    }
    .form-control:focus, .form-select:focus {
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }
    .resultado-box {
      background: white;
      border: 2px solid var(--card-border);
      border-radius: 6px;
      padding: 1rem;
      margin-top: 1rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85em;
      white-space: pre-wrap;
    }
    .summary-highlight {
      background: #f1f5f9;
      border-left: 4px solid var(--primary);
      padding: 0.75rem;
      margin-bottom: 1rem;
      border-radius: 6px;
    }
    .btn-primary {
      background: var(--primary);
      border: none;
      padding: 0.5rem 1.2rem;
      border-radius: 6px;
      font-weight: 500;
      font-size: 0.95rem;
      transition: all 0.2s;
    }
    .btn-primary:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }
    .form-check-input:checked {
      background-color: var(--primary);
      border-color: var(--primary);
    }
    .form-check-label {
      font-size: 0.9rem;
    }
    @media (max-width: 768px) {
      .container {
        padding: 0 10px;
      }
      .card-header h4 {
        font-size: 1.1rem;
      }
    }
    .copy-btn {
      margin-left: 5px;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark" style="background: var(--primary);">
    <div class="container">
      <a class="navbar-brand" href="#">Calculadora Estrutural</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
    </div>
  </nav>

  <div class="container my-2">
    <h4 class="text-center mb-3 fw-semibold">Cálculo de Materiais para Estruturas</h4>
    
    <ul class="nav nav-pills justify-content-center gap-2 mb-3" id="calcTabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="coluna-tab" data-bs-toggle="tab" data-bs-target="#coluna" type="button">
          <i class="bi bi-columns-gap me-2"></i>Coluna
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="sapata-tab" data-bs-toggle="tab" data-bs-target="#sapata" type="button">
          <i class="bi bi-square-fill me-2"></i>Sapata
        </button>
      </li>
    </ul>

    <div class="tab-content">
      <div class="tab-pane fade show active" id="coluna">
        <div class="main-card">
          <div class="card-header py-2">
            <h5 class="mb-0">Aba Coluna</h5>
          </div>
          <div class="card-body p-2 p-md-3">
            <form id="formColuna" class="row g-2">
              <div class="col-6">
                <label class="form-label">Ferro Principal</label>
                <select class="form-select form-select-sm" id="tipoFerroColuna" required>
                  <option value="1/2">1/2"</option>
                  <option value="3/8" selected>3/8" (Padrão)</option>
                  <option value="5/16">5/16"</option>
                </select>
              </div>
              <div class="col-6">
                <label class="form-label">Quantidade</label>
                <select class="form-select form-select-sm" id="numFerroColuna" required>
                  <option value="4" selected>4 unid.</option>
                  <option value="6">6 unid.</option>
                  <option value="8">8 unid.</option>
                  <option value="10">10 unid.</option>
                  <option value="12">12 unid.</option>
                </select>
              </div>
              <div class="col-12 mt-1" id="bitolaAdicionalContainer" style="display: none;">
                <div class="border p-2 rounded bg-light">
                  <label class="form-label">Adicionais</label>
                  <select class="form-select form-select-sm" id="bitolaAdicional">
                    <option value="1/2">1/2"</option>
                    <option value="3/8" selected>3/8"</option>
                    <option value="5/16">5/16"</option>
                    <option value="1/4">1/4"</option>
                  </select>
                  <small class="text-muted" id="bitolaAdicionalDesc" style="font-size: 0.75rem;">Bitola extra</small>
                </div>
              </div>
              <div class="col-12 mt-1">
                <div class="form-check form-switch mb-1">
                  <input class="form-check-input" type="checkbox" id="adicionarCavaletes">
                  <label class="form-check-label form-label mb-0">Com Cavaletes</label>
                </div>
                <div id="cavaletesContainer" style="display: none;">
                  <div class="row g-2">
                    <div class="col-6">
                      <select class="form-select form-select-sm" id="tipoCavalete">
                        <option value="5/16">5/16"</option>
                        <option value="1/4">1/4"</option>
                        <option value="3/8">3/8"</option>
                        <option value="1/2">1/2"</option>
                      </select>
                    </div>
                    <div class="col-6">
                      <select class="form-select form-select-sm" id="qtdCavaletes">
                        <option value="1">1 Cav.</option>
                        <option value="2" selected>2 Cav.</option>
                      </select>
                    </div>
                  </div>
                </div>
              </div>
              <div class="col-6">
                <label class="form-label">Dimensão 1 (cm)</label>
                <input type="number" class="form-control form-control-sm" id="medida1" min="0.1" step="any" required>
              </div>
              <div class="col-6">
                <label class="form-label">Dimensão 2 (cm)</label>
                <input type="number" class="form-control form-control-sm" id="medida2" min="0.1" step="any" required>
              </div>
              <div class="col-6">
                <label class="form-label">Ferro Estribos</label>
                <select class="form-select form-select-sm" id="tipoFerroEstribo">
                  <option value="3/16" selected>3/16"</option>
                  <option value="1/4">1/4"</option>
                  <option value="5/16">5/16"</option>
                </select>
              </div>
              <div class="col-6">
                <label class="form-label">Espaçamento</label>
                <select class="form-select form-select-sm" id="espacamentoEstribos">
                  <option value="30" selected>30 cm</option>
                  <option value="20">20 cm</option>
                  <option value="15">15 cm</option>
                  <option value="12">12 cm</option>
                  <option value="10">10 cm</option>
                </select>
              </div>
              <div class="col-12 mt-3">
                <button type="submit" class="btn btn-primary btn-sm w-100">
                  <i class="bi bi-calculator me-1"></i>Calcular
                </button>
              </div>
            </form>
            <div id="resumoColuna" class="summary-highlight p-2 mt-3" style="display:none;font-size:0.85rem;"></div>
            <div id="resultadoColuna" class="resultado-box p-2 mt-2" style="display:none;font-size:0.75rem;"></div>
          </div>
        </div>
      </div>

      <div class="tab-pane fade" id="sapata">
        <div class="main-card">
          <div class="card-header py-2">
            <h5 class="mb-0">Aba Sapata</h5>
          </div>
          <div class="card-body p-2 p-md-3">
            <form id="formSapata" class="row g-2">
              <div class="col-4">
                <label class="form-label">Comp.(cm)</label>
                <input type="number" class="form-control form-control-sm" id="comprimentoSapata" min="0.1" step="any" required>
              </div>
              <div class="col-4">
                <label class="form-label">Larg.(cm)</label>
                <input type="number" class="form-control form-control-sm" id="larguraSapata" min="0.1" step="any" required>
              </div>
              <div class="col-4">
                <label class="form-label">Alt.(cm)</label>
                <input type="number" class="form-control form-control-sm" id="alturaSapata" min="0.1" step="any" required>
              </div>
              <div class="col-6">
                <label class="form-label">Tipo Ferro</label>
                <select class="form-select form-select-sm" id="tipoFerroSapata">
                  <option value="3/8" selected>3/8"</option>
                  <option value="1/2">1/2"</option>
                </select>
              </div>
              <div class="col-6">
                <label class="form-label">Qtd. Ferros</label>
                <select class="form-select form-select-sm" id="numFerroSapata" required>
                  <option value="6">6</option>
                  <option value="8" selected>8</option>
                  <option value="10">10</option>
                  <option value="12">12</option>
                  <option value="14">14</option>
                </select>
              </div>
              <div class="col-12 mt-3">
                <button type="submit" class="btn btn-primary btn-sm w-100">
                  <i class="bi bi-calculator me-1"></i>Calcular
                </button>
              </div>
            </form>
            <div id="resumoSapata" class="summary-highlight p-2 mt-3" style="display:none;font-size:0.85rem;"></div>
            <div id="resultadoSapata" class="resultado-box p-2 mt-2" style="display:none;font-size:0.75rem;"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const CONFIG = {
      TAMANHO_BARRA_M: 12,
      FATOR_FOLGA: 1.20,
      CONSUMO_ARAME_POR_PONTO: 0.0032333333,
      TAMANHO_CAVALETE_M: 3,
      FOLGA_DOBRA_ESTRIBO_CM: 5,
      FOLGA_DOBRA_SAPATA_M: 0.05,
      ARAME_SAPATA_POR_FERRO_KG: 0.01296
    };

    const produtos = {
      "1/2": { code: "01395", desc: "FERRO 1/2" },
      "1/4": { code: "01394", desc: "FERRO 1/4" },
      "3/16": { code: "01396", desc: "FERRO 3/16" },
      "3/8": { code: "01393", desc: "FERRO 3/8" },
      "5/16": { code: "01397", desc: "FERRO 5/16" },
      "arame": { code: "12242", desc: "ARAME RECOZIDO TORCIDO" }
    };

    const formatNumber = (num, decimals) =>
      parseFloat(num).toLocaleString('pt-BR', {
        minimumFractionDigits: decimals,
        maximumFractionDigits: decimals
      });

    const roundUp5 = (num) => (Math.ceil(num * 100000) / 100000).toFixed(5);

    function reattachUIHelpers() {
      document.querySelectorAll('.copy-btn').forEach(btn => {
        let clone = btn.cloneNode(true);
        btn.parentNode.replaceChild(clone, btn);

        clone.addEventListener('click', function() {
          let value = this.getAttribute('data-copy');

          navigator.clipboard.writeText(value).then(() => {
            this.innerHTML = '<i class="bi bi-clipboard-check"></i>';
            setTimeout(() => {
              this.innerHTML = '<i class="bi bi-clipboard"></i>';
            }, 1500);
          });
        });
      });

      document.querySelectorAll('.editable-meters').forEach(input => {
        let clone = input.cloneNode(true);
        input.parentNode.replaceChild(clone, input);

        clone.addEventListener('input', function() {
          let metros = parseFloat(this.value) || 0;
          let row = this.closest('tr');
          let barrasCell = row.querySelector('.barras-value');
          let copyBtn = row.querySelector('.copy-btn');
          let isArame = row.querySelector('td:nth-child(2)').textContent.includes('ARAME');

          let barras = isArame
            ? metros.toFixed(5)
            : (metros / CONFIG.TAMANHO_BARRA_M).toFixed(5);

          barrasCell.textContent = formatNumber(parseFloat(barras), 5);
          copyBtn.setAttribute('data-copy', barras.replace('.', ','));
        });
      });
    }

    function calcularConsumo(tipo, metros) {
      let metrosComFolga = metros * CONFIG.FATOR_FOLGA;

      if (tipo === "1/4" || tipo === "3/16") {
        metrosComFolga = Math.ceil(metrosComFolga);
      } else if (["3/8", "5/16", "1/2"].includes(tipo)) {
        let resto = metrosComFolga % 1;

        if (resto > 0 && resto <= 0.5) {
          metrosComFolga = Math.floor(metrosComFolga) + 0.5;
        } else if (resto > 0.5) {
          metrosComFolga = Math.ceil(metrosComFolga);
        }
      }

      let sobra = CONFIG.TAMANHO_BARRA_M - (metrosComFolga % CONFIG.TAMANHO_BARRA_M);

      if (sobra === 12) sobra = 0;

      if (sobra > 0) {
        if (tipo === "1/2") {
          if (sobra < 6) metrosComFolga += sobra;
        } else if (tipo === "3/8" || tipo === "5/16") {
          if (sobra <= 1.5) metrosComFolga += sobra;
        }
      }

      return {
        metros: metrosComFolga,
        barras: metrosComFolga / CONFIG.TAMANHO_BARRA_M
      };
    }

    document.getElementById("numFerroColuna").addEventListener("change", function() {
      const bitolaContainer = document.getElementById("bitolaAdicionalContainer");
      const bitolaDesc = document.getElementById("bitolaAdicionalDesc");
      const numFerro = parseInt(this.value);

      if (numFerro > 4) {
        bitolaContainer.style.display = "block";
        bitolaDesc.textContent = `Bitola para os ${numFerro - 4} ferros adicionais`;
      } else {
        bitolaContainer.style.display = "none";
      }
    });

    document.getElementById("adicionarCavaletes").addEventListener("change", function() {
      document.getElementById("cavaletesContainer").style.display = this.checked ? "block" : "none";
    });

    function renderizarResumoFinal(dadosConsumo, arameM, logInfo, nomeAba, sufixoHTML) {
      let html = `<h5 class="mb-3">Resumo Final - ${nomeAba}</h5>
      <table class="table table-sm table-borderless">
        <thead>
          <tr>
            <th>Código</th><th>Material</th><th>Total (m/kg)</th><th>Barras</th>
          </tr>
        </thead>
        <tbody>`;

      for (let tipo in dadosConsumo) {
        let prod = produtos[tipo] || { code: tipo, desc: `FERRO ${tipo}` };

        html += `<tr>
            <td>${prod.code}</td>
            <td>${prod.desc}</td>
            <td>
              <input
                type="number"
                class="form-control form-control-sm editable-meters"
                value="${dadosConsumo[tipo].metros.toFixed(2)}"
                step="0.01"
                min="0"
              >
            </td>
            <td>
              <span class="barras-value">${formatNumber(dadosConsumo[tipo].barras, 5)}</span>
              <button
                class="btn btn-sm btn-outline-secondary copy-btn"
                data-copy="${dadosConsumo[tipo].barras.toFixed(5).replace('.', ',')}"
                title="Copiar"
              >
                <i class="bi bi-clipboard"></i>
              </button>
            </td>
          </tr>`;
      }

      html += `<tr>
          <td>${produtos["arame"].code}</td>
          <td>${produtos["arame"].desc}</td>
          <td>
            <input
              type="number"
              class="form-control form-control-sm editable-meters"
              value="${parseFloat(arameM).toFixed(5)}"
              step="0.00001"
              min="0"
            >
          </td>
          <td>
            <span class="barras-value">${formatNumber(parseFloat(arameM), 5)}</span>
            <button
              class="btn btn-sm btn-outline-secondary copy-btn"
              data-copy="${parseFloat(arameM).toFixed(5).replace('.', ',')}"
              title="Copiar"
            >
              <i class="bi bi-clipboard"></i>
            </button>
          </td>
        </tr>
      </tbody></table>`;

      let divResumo = document.getElementById(`resumo${sufixoHTML}`);
      let divResultado = document.getElementById(`resultado${sufixoHTML}`);

      divResumo.style.display = "block";
      divResumo.innerHTML = html;
      divResultado.style.display = "block";
      divResultado.textContent = logInfo;

      reattachUIHelpers();
    }

    document.getElementById("formColuna").addEventListener("submit", function(e) {
      e.preventDefault();

      const tipoFerro = document.getElementById("tipoFerroColuna").value;
      const numFerro = parseInt(document.getElementById("numFerroColuna").value);
      const extraFerro = numFerro > 4 ? document.getElementById("bitolaAdicional").value : tipoFerro;

      const adicionarCavaletes = document.getElementById("adicionarCavaletes").checked;
      const ferroCavalete = adicionarCavaletes ? document.getElementById("tipoCavalete").value : null;
      const qtdCavaletes = adicionarCavaletes ? parseInt(document.getElementById("qtdCavaletes").value) : 0;

      const med1 = parseFloat(document.getElementById("medida1").value);
      const med2 = parseFloat(document.getElementById("medida2").value);
      const ferroEstribo = document.getElementById("tipoFerroEstribo").value;
      const espacamento = parseInt(document.getElementById("espacamentoEstribos").value);

      if (med1 <= 0 || med2 <= 0) {
        alert("As medidas da coluna devem ser um valor positivo e maior que zero.");
        return;
      }

      let log = "===== CÁLCULO DA COLUNA =====\n";
      log += `Ferro da Coluna: ${tipoFerro}\n`;

      let descrQtd = numFerro === 4
        ? "4 ferros"
        : `4 ferros + ${numFerro - 4} adicionais (${extraFerro})`;

      log += `Quantidade: ${descrQtd}\n`;

      if (adicionarCavaletes) {
        log += `Cavaletes: ${qtdCavaletes}x ${ferroCavalete} (${CONFIG.TAMANHO_CAVALETE_M}m/cada)\n`;
      }

      log += `Medidas: ${med1}cm x ${med2}cm | Estribos: ${ferroEstribo} @ ${espacamento}cm\n\n`;

      let somaFerroVert = {};

      const agruparSoma = (tipo, amt) => {
        somaFerroVert[tipo] = (somaFerroVert[tipo] || 0) + amt;
      };

      agruparSoma(tipoFerro, 4);

      if (numFerro > 4) {
        agruparSoma(extraFerro, numFerro - 4);
      }

      if (adicionarCavaletes) {
        agruparSoma(ferroCavalete, qtdCavaletes * CONFIG.TAMANHO_CAVALETE_M);
      }

      log += ">> Ferros Verticais:\n";

      Object.keys(somaFerroVert).forEach(tipo => {
        log += `   - Ferro ${tipo}: ${somaFerroVert[tipo].toFixed(2)} m\n`;
      });

      log += "\n";

      let compEstribo_cm = ((med1 + med2) * 2) + CONFIG.FOLGA_DOBRA_ESTRIBO_CM;
      let compEstribo_m = compEstribo_cm / 100;

      let estribosP_Metro =
        espacamento === 30 ? 3.33333333 :
        espacamento === 20 ? 5 :
        espacamento === 15 ? 7 :
        espacamento === 12 ? 8.33333333 : 10;

      let totalEst_m = compEstribo_m * estribosP_Metro;

      log += ">> Estribos:\n";
      log += `   - Total de ferro p/ estribo: ${compEstribo_m.toFixed(2)}m/unid x ${estribosP_Metro.toFixed(2)} = ${totalEst_m.toFixed(2)} m\n\n`;

      let ttlMetrosVerticaisAgrupados = Object.values(somaFerroVert).reduce((a, b) => a + b, 0);
      let totalPts = ttlMetrosVerticaisAgrupados * estribosP_Metro;
      let arameM = parseFloat(roundUp5(totalPts * CONFIG.CONSUMO_ARAME_POR_PONTO));

      log += `>> Arame:\n   - Pontos: ${totalPts.toFixed(2)} | Consumo: ${arameM} kg\n\n`;

      log += `>> Consumo em Barras (com ${(CONFIG.FATOR_FOLGA - 1) * 100}% de folga):\n`;

      let mapConsumoFinal = {};

      Object.keys(somaFerroVert).forEach(tipo => {
        let res = calcularConsumo(tipo, somaFerroVert[tipo]);
        mapConsumoFinal[tipo] = res;

        log += `   - Ferro ${tipo}: ${somaFerroVert[tipo].toFixed(2)}m → (folga) ${res.metros.toFixed(2)}m → ${res.barras.toFixed(5)} barras\n`;
      });

      let resultEstribo = calcularConsumo(ferroEstribo, totalEst_m);

      if (mapConsumoFinal[ferroEstribo]) {
        mapConsumoFinal[ferroEstribo].metros += resultEstribo.metros;
        mapConsumoFinal[ferroEstribo].barras += resultEstribo.barras;
      } else {
        mapConsumoFinal[ferroEstribo] = resultEstribo;
      }

      log += `   - Estribos (${ferroEstribo}): ${totalEst_m.toFixed(2)}m → (folga) ${resultEstribo.metros.toFixed(2)}m → ${resultEstribo.barras.toFixed(5)} barras\n`;

      renderizarResumoFinal(mapConsumoFinal, arameM, log, "Coluna", "Coluna");
    });

    document.getElementById("formSapata").addEventListener("submit", function(e) {
      e.preventDefault();

      const comp = parseFloat(document.getElementById("comprimentoSapata").value);
      const larg = parseFloat(document.getElementById("larguraSapata").value);
      const alt = parseFloat(document.getElementById("alturaSapata").value);
      const tipoFerro = document.getElementById("tipoFerroSapata").value;
      const numFerro = parseInt(document.getElementById("numFerroSapata").value);

      if (comp <= 0 || larg <= 0 || alt <= 0) {
        alert("As dimensões da sapata precisam ser maiores que 0.");
        return;
      }

      if (![6, 8, 10, 12, 14].includes(numFerro)) {
        alert("Quantidade de ferros da sapata inválida.");
        return;
      }

      let log = "===== CÁLCULO DA SAPATA =====\n";
      log += `Dimensões: ${comp}x${larg}x${alt} cm | Ferro: ${tipoFerro} | Qtd: ${numFerro}\n\n`;

      const cM = comp / 100;
      const lM = larg / 100;
      const aM = alt / 100;

      let eixoX = (((cM + aM) * 2) + CONFIG.FOLGA_DOBRA_SAPATA_M) * (numFerro / 2);
      let eixoY = (((lM + aM) * 2) + CONFIG.FOLGA_DOBRA_SAPATA_M) * (numFerro / 2);
      let totMetros = eixoX + eixoY;

      log += `>> Total de ferro p/ Eixos: ${eixoX.toFixed(2)}m (X) + ${eixoY.toFixed(2)}m (Y) = ${totMetros.toFixed(2)} m\n`;

      const amarracaoM = parseFloat(
        roundUp5(numFerro * CONFIG.ARAME_SAPATA_POR_FERRO_KG)
      );

      log += `>> Amarração Sapata (Regra proporcional da tabela padrão): ${amarracaoM.toFixed(5)} kg\n\n`;

      let consumoFerro = calcularConsumo(tipoFerro, totMetros);

      log += `>> Consumo Comercial em Barras (com ${(CONFIG.FATOR_FOLGA - 1) * 100}% de folga):\n`;
      log += `   - Métrica linear bruta c/ folga: ${(totMetros * CONFIG.FATOR_FOLGA).toFixed(2)} m\n`;
      log += `   - Arredondamento Ajustado ao Retalho Real da Barra (${consumoFerro.barras.toFixed(5)} barras): ${consumoFerro.metros.toFixed(2)} m\n\n`;

      let consumoMap = {
        [tipoFerro]: consumoFerro
      };

      renderizarResumoFinal(consumoMap, amarracaoM, log, "Sapata", "Sapata");
    });
  </script>
